<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐧 Terminal — Linux Web</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/boot_and_shutdown.css">
    <link rel="stylesheet" href="/css/terminal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
</head>
<body>
    <div class="terminal-app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="logo-text">🐧 LINUX WEB</span>
            </div>
            <div class="server-list">
                <div class="server-item active" id="serverItem">
                    <span class="server-name" id="serverName">Terminal Session</span>
                    <span class="status-dot" id="statusDot"></span>
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-sm btn-secondary" onclick="newSession()">➕ New Session</button>
                <button class="btn btn-sm btn-secondary" onclick="disconnect()">🔌 Disconnect</button>
                <button class="btn btn-sm btn-danger" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Main Terminal Area -->
        <div class="main-area">
            <div class="terminal-header">
                <span id="session-title">user@localhost:~$</span>
                <div class="status-bar">
                    <span id="statusText">⏳ Connecting...</span>
                    <span id="uptime">00:00:00</span>
                </div>
            </div>
            <div id="terminal-container"></div>
        </div>

        <!-- Resizer -->
        <div class="resizer"></div>

        <!-- System Stats Panel -->
        <div class="stats-panel">
            <div class="stats-header">System Stats</div>
            <div id="stats-content">Loading system info...</div>
        </div>
    </div>

    <!-- XTerm JS -->
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links/lib/xterm-addon-web-links.min.js"></script>
    
    <script src="/js/main.js"></script>
    <script src="/js/terminal.js"></script>
</body>
</html>
