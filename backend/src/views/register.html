<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Register — Linux Web Terminal</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css" />
    <link rel="stylesheet" type="text/css" href="../css/boot_and_shutdown.css" />
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="login-screen">
        <h1 class="login-title">Create Your Account</h1>
        <p class="login-subtitle">Daftar akun linux-web untuk akses penuh</p>
        
        <form id="registerForm" class="login-form">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="fullname" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password (min 6 characters)</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-large">📝 Register Akun</button>
        </form>

        <div class="switch-mode">
            <p>Sudah punya akun? <a href="./login.html">Login di sini →</a></p>
            <p><a href="./boot.html">← Kembali ke Beranda</a></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (password.length < 6) {
                alert('Password harus min 6 karakter');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ fullname, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    alert('✅ Akun berhasil dibuat! Silakan login.');
                    window.location.href = './login.html';
                } else {
                    alert('❌ Gagal: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                alert('❌ Koneksi gagal. Pastikan backend sudah running.');
            }
        };
    </script>
</body>
</html>
