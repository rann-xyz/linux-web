version: '3.8'

services:
  backend:
    build: .
    container_name: terminal-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - STORAGE_ROOT=/data/users
      - MAX_STORAGE_GB=5
      - MAX_MEMORY_MB=512
      - MAX_CPU_CORES=1
      - MAX_PROCESSES=50
      - MAX_TERMINAL_SESSIONS=5
      - SESSION_IDLE_TIMEOUT_MINUTES=60
      - SESSION_MAX_LIFETIME_HOURS=168
      - MAX_UPLOAD_MB=100
    ports:
      - "4000:4000"
    volumes:
      - terminal-storage:/data/users
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  terminal-storage:
    driver: local