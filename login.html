<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login — Linux Web Terminal</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/boot_and_shutdown.css">
</head>
<body>
    <div class="login-screen">
        <h1 class="login-title">🔐 Login to Linux Web Terminal</h1>
        
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-large">🔓 Sign In</button>
        </form>
        
        <div class="switch-mode">
            <p>Don't have an account? <a href="#" id="showRegister">📝 Register here</a></p>
            <p><a href="/boot.html">← Back to Home</a></p>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
